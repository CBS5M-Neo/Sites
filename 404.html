<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Страница не найдена — Neo</title>
<script>
// Работает и на старом пути (/Sites/<slug>/), и на домене в корне (/<slug>/)
(async () => {
  const prefix = location.pathname.startsWith('/Sites/') ? '/Sites/' : '/';
  const seg = decodeURIComponent(location.pathname.slice(prefix.length).split('/')[0] || '');
  if (seg) {
    try {
      const r = await fetch(prefix + 'sites.json', {cache: 'no-store'});
      const reg = await r.json();
      if ((reg.sites || []).some(s => s.slug === seg)) {
        location.replace(prefix + encodeURIComponent(seg) + '/');
        return;
      }
    } catch (e) { /* ignore */ }
  }
  location.replace(prefix);
})();
</script>
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08080d;color:#f2f2f8;font-family:system-ui,sans-serif;text-align:center}
  a{color:#8f7bff}
</style>
</head>
<body>
<div>
  <h1>404</h1>
  <p>Такой страницы нет. Сейчас перенаправим вас в <a href="/">каталог сайтов Neo</a>…</p>
</div>
</body>
</html>

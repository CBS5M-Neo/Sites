name: 🌐 Заказ сайта
description: Заказать статичный сайт у Neo — 100 ₽ (8 правок включено)
title: '[Заказ] '
labels: ['новый-сайт']
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за заказ! Опишите сайт своими словами — **Neo проверит и улучшит
        ваш запрос**, а ИИ соберёт готовый сайт и опубликует его здесь же.

        **Стоимость: 100 ₽ · 8 правок включено · обычно готово в течение суток**

        ⚠️ Neo создаёт только **статичные** сайты: визитки, портфолио, лендинги,
        страницы услуг, приглашения. Магазины с оплатой, кабинеты и блоги с админкой
        пока не поддерживаются.
  - type: input
    id: site-name
    attributes:
      label: Название сайта
      description: Как будет называться сайт (по нему создаётся папка)
      placeholder: Портфолио фотографа Анны
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Опишите сайт
      description: |
        Что за сайт, для кого он, какие разделы нужны, какой стиль и цвета нравятся.
        Можно очень простыми словами — автоматика Neo сама дополнит детали.
      placeholder: |
        Сайт-визитка моего кафе в Казани. Нужны: меню с ценами, часы работы,
        адрес с картой, 3–4 фотографии зала, кнопка «забронировать стол» (пишет в вотсап).
        Тёплые цвета, уютный стиль.
    validations:
      required: true
  - type: checkboxes
    id: options
    attributes:
      label: Настройки
      options:
        - label: Подключить опцию «20 ₽ за неделю без посетителей» (если не отметить — при 7 днях без визитов сайт автоматически выключится)
    validations:
      required: true

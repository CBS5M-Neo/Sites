name: Deploy Pages · Sites

# Публикует каталог сайтов и сами сайты на GitHub Pages.
# Включите в настройках репозитория: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write   # для configure-pages с enablement: true (автовключение Pages)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать статические файлы (без служебных папок)
        run: |
          mkdir -p _pages
          cp -r ./* _pages/ 2>/dev/null || true
          rm -rf _pages/pipeline _pages/.github _pages/docs _pages/tools _pages/scripts
          rm -f _pages/.gitignore _pages/_pages -r
          mkdir -p _pages/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # включить Pages, если ещё не включён

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - id: deployment
        uses: actions/deploy-pages@v4

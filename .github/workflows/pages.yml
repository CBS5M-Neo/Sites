name: Deploy Pages · Sites

# Публикует каталог сайтов и сами сайты на GitHub Pages.
# Pages включается автоматически (configure-pages: enablement).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать статические файлы (без служебных папок)
        run: |
          mkdir -p _pages
          find . -mindepth 1 -maxdepth 1 \
            ! -name '_pages' ! -name '.git' ! -name 'pipeline' \
            ! -name 'docs' ! -name '.github' \
            -exec cp -r {} _pages/ \;
          rm -f _pages/.gitignore
          touch _pages/.nojekyll
          echo "--- _pages ---"
          ls -A _pages

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # включить Pages, если ещё не включён

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - id: deployment
        uses: actions/deploy-pages@v4

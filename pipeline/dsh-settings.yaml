# Настройки модели для DeepSeek Harness (используется pipeline и GitHub Actions).
# Провайдер B.AI; доступны 4 модели: GLM-5.3-flash (умолчание), Hy3,
# Qwen3.8-Flash, Mimo-v2.5. Ключ берётся из переменной окружения BAI_API_KEY
# (локально — из credentials-сервиса DSH, в Actions — из секретов).
# Neo проверяет доступность выбранной модели и при исчерпанном лимите
# автоматически переключается на другую (см. pipeline/lib/common.js → pickWorkingModel).
agent-default-model:
  provider: bai
  model: glm-5.3-flash

llm-pi-ai:
  providers:
    bai:
      displayName: B.AI
      apiKeyEnv: BAI_API_KEY
      api: openai-completions
      baseURL: https://api.b.ai/v1
      models:
        - id: glm-5.3-flash
        - id: hy3
        - id: qwen3.8-flash
        - id: mimo-v2.5
